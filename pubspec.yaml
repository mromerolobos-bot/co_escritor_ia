name: co_escritor_ia
description: App Co-Escritor IA (Modo Manejo) - Dictado de voz offline-first con soporte Gemini/DeepSeek y sinc con Google Docs.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.2
  connectivity_plus: ^6.0.3
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
