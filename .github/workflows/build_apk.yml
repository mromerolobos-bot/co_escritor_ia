name: Compilar APK Co-Escritor IA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK Android
        run: flutter build apk --debug

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: CoEscritorIA-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
